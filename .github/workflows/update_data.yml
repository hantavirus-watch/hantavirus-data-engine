name: Update outbreak data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: update-outbreak-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest outbreak data
        run: |
          for attempt in 1 2 3; do
            if python fetch_data.py; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Fetch failed after 3 attempts"
              exit 1
            fi

            echo "Fetch attempt $attempt failed, retrying in 60 seconds..."
            sleep 60
          done

      - name: Commit updated data
        run: |
          if git diff --quiet data/outbreaks.json; then
            echo "No data changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/outbreaks.json
          git commit -m "chore: update outbreak data"
          git push